[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-tutor"
version = "0.1.0"
requires-python = ">=3.10"
readme = "readme.md"
dependencies = [
    "annotated-types>=0.8.0",
    "anyio>=4.14.2",
    "certifi>=2026.7.22",
    "charset-normalizer>=3.5.1",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "idna>=3.19",
    "ollama>=0.6.2",
    "pip>=26.2.1",
    "pydantic>=2.13.4",
    "pydantic_core>=2.46.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "typing_extensions >=4.16.0",
    "typing-inspection >=0.4.4",
    "urllib3>=2.7.0"
]

[project.scripts]
ai-tutor = "ai_tutor.notion.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_tutor"]